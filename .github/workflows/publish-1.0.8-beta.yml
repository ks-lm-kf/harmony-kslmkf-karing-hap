name: Publish 1.0.8-beta release asset

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload HAP and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v1.0.8-beta karing-harmony-1.0.8-beta.hap --clobber
          gh release edit v1.0.8-beta --draft=false --prerelease --title "Karing Harmony 1.0.8-beta"
